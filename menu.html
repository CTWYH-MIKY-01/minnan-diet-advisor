<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周食谱 · 健康饮食调理</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css?v=21">
</head>
<body>
<div class="container container-wide">

  <nav class="nav">
    <a class="nav-item" href="index.html">① 今日养生</a>
    <a class="nav-item active" href="menu.html">② 周食谱</a>
    <a class="nav-item" href="family.html">③ 家人与食物</a>
  </nav>

  <h2>🍲 家庭周食谱</h2>
  <p class="sub">按节气 + 体质自动配餐 · 可多次生成 · 可单菜替换</p>

  <!-- 设置区 -->
  <div id="setupBox" class="setup-box">
    <div class="row2">
      <div class="form-item">
        <label>居住地区（影响天气与当季食材）</label>
        <select id="regionSel"></select>
      </div>
      <div class="form-item">
        <label>起始日期</label>
        <input type="date" id="startDate">
      </div>
    </div>

    <div class="row2">
      <div class="form-item">
        <label>用餐人数（用于用量）</label>
        <input type="number" id="personNum" value="3" min="1" max="12">
      </div>
      <div class="form-item">
        <label>版本</label>
        <select id="modeSel">
          <option value="family">全家版（推荐）</option>
          <option value="single">单人版</option>
        </select>
      </div>
    </div>

    <div class="form-item" id="singlePickWrap" style="display:none">
      <label>单人版：选择成员</label>
      <select id="singlePick"></select>
    </div>

    <div class="form-item">
      <label>口味倾向（可选）</label>
      <div id="prefBox" class="chip-group"></div>
    </div>

    <div class="form-item">
      <label>本周要求（可选）：控制某样食物一周最多出现几次</label>
      <div id="wrQuick" class="chip-group wr-quick"></div>
      <div id="wrList"></div>
      <div class="wr-add-row">
        <input type="text" id="wrKw" placeholder="食物关键词，如 豆浆 / 粥">
        <select id="wrMeal">
          <option value="all">不限餐次</option>
          <option value="breakfast">仅早餐</option>
          <option value="lunch">仅午餐</option>
          <option value="dinner">仅晚餐</option>
        </select>
        <select id="wrMax">
          <option value="0">不吃</option>
          <option value="1" selected>限 1 次</option>
          <option value="2">限 2 次</option>
          <option value="3">限 3 次</option>
        </select>
        <button type="button" id="wrAddBtn" class="ghost wr-add-btn">添加</button>
      </div>
      <p class="hint">示例：「早餐豆浆限 1 次」即一周 7 天早餐里最多 1 天出现豆浆；「粥限 2 次」即全周粥类最多吃 2 餐。关键词会同时匹配菜名和食材名。</p>
    </div>

    <div class="btn-row">
      <button type="button" id="genBtn">生成 / 换一套</button>
      <button type="button" id="resetBtn" class="ghost">恢复默认</button>
    </div>
    <p class="hint" id="memberWarn"></p>
  </div>

  <!-- 结果区 -->
  <div id="resultBox"></div>

  <p class="tip" style="margin-top:18px">
    本食谱仅为养生参考，<b>不能替代医生诊疗与药物</b>。有结节、慢病者请遵医嘱。
  </p>
  <p class="gray center tiny">健康饮食调理 · 版权 © 王映华 · 养生参考，不能替代医嘱</p>
</div>

<script src="js/storage.js?v=21"></script>
<script src="js/jieqi.js?v=21"></script>
<script src="js/rule.js?v=21"></script>
<script src="js/tcm.js?v=21"></script>
<script src="js/dishes.js?v=21"></script>
<script src="js/engine.js?v=21"></script>
<script src="js/page-menu.js?v=21"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家人与食物 · 健康饮食调理</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<div class="container container-wide">

  <nav class="nav">
    <a class="nav-item" href="index.html">① 今日养生</a>
    <a class="nav-item" href="menu.html">② 周食谱</a>
    <a class="nav-item active" href="family.html">③ 家人与食物</a>
  </nav>

  <h2>👨‍👩‍👧 家人与食物</h2>
  <p class="sub">录入体质 · 收藏食材 · 一键甄选能不能吃</p>

  <!-- ============ 一、家庭成员 ============ -->
  <div class="section-title">家庭成员</div>
  <div id="memberList" class="member-list"></div>
  <button type="button" id="addMemberBtn" class="primary">+ 添加一位家人</button>
  <p class="hint">每个人的体质、体检异常单独保存，互不覆盖。全家食谱会自动综合所有成员的情况。</p>

  <!-- ============ 二、食物购物车 ============ -->
  <div class="section-title" style="margin-top:26px">食物甄选</div>
  <p class="hint" style="margin-top:-4px">把想吃的、想试的加进购物车，再按家人情况分析「能不能吃、为什么、换成什么」。</p>

  <div class="tabs" id="foodTabs">
    <button type="button" class="tab active" data-ftab="lib">食物库</button>
    <button type="button" class="tab" data-ftab="cart">我的购物车 <span id="cartNum">0</span></button>
    <button type="button" class="tab" data-ftab="analyze">甄选分析</button>
  </div>

  <!-- 食物库 -->
  <div id="ftab-lib" class="tab-pane active">
    <div class="row2">
      <div class="form-item">
        <label>分类</label>
        <select id="catSel"></select>
      </div>
      <div class="form-item">
        <label>搜索</label>
        <input type="text" id="foodSearch" placeholder="如 山药 / 苦瓜">
      </div>
    </div>
    <div id="foodList" class="food-list"></div>
  </div>

  <!-- 购物车 -->
  <div id="ftab-cart" class="tab-pane">
    <div id="cartList" class="cart-list"></div>
    <div class="btn-row">
      <button type="button" id="goAnalyzeBtn" class="primary">开始甄选分析</button>
      <button type="button" id="clearCartBtn" class="ghost-btn">清空购物车</button>
    </div>
  </div>

  <!-- 甄选分析 -->
  <div id="ftab-analyze" class="tab-pane">
    <div id="analyzeBox"></div>
  </div>

  <p class="tip" style="margin-top:20px">
    食物性味与宜忌为中医养生传统认识，<b>不能替代医生诊疗与药物</b>。慢病、结节、孕期请遵医嘱。
  </p>
  <p class="gray center tiny">健康饮食调理 · 版权 © 王映华 · 养生参考，不能替代医嘱</p>
</div>

<!-- ============ 成员弹层 ============ -->
<div id="memberModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle">添加成员</span>
      <button type="button" id="modalClose" class="x">×</button>
    </div>

    <div class="form-item">
      <label>称呼</label>
      <input type="text" id="fName" placeholder="如：我 / 爱人 / 妈妈">
    </div>

    <div class="form-item">
      <label>体质（可多选）</label>
      <div id="fTizhi" class="chip-group"></div>
      <p class="hint">不确定可只选最明显的一项；老人小孩可留空（按平和处理）</p>
    </div>

    <div class="row2">
      <div class="form-item">
        <label>身高 cm</label>
        <input type="number" id="fHeight" placeholder="如 170">
      </div>
      <div class="form-item">
        <label>体重 kg</label>
        <input type="number" id="fWeight" placeholder="如 65">
      </div>
    </div>

    <div class="form-item">
      <label>体检异常（可多选）</label>
      <div id="fDisease" class="chip-group"></div>
    </div>

    <div class="form-item">
      <label>口味与忌口备注（选填）</label>
      <input type="text" id="fNote" placeholder="如：不吃香菜、爱吃辣、不吃牛肉">
    </div>

    <div class="modal-foot">
      <button type="button" id="modalSave" class="primary">保存这位成员</button>
      <button type="button" id="modalDel" class="ghost-btn hidden">删除这位成员</button>
    </div>
  </div>
</div>

<script src="js/storage.js?v=17"></script>
<script src="js/jieqi.js?v=17"></script>
<script src="js/rule.js?v=17"></script>
<script src="js/tcm.js?v=17"></script>
<script src="js/engine.js?v=17"></script>
<script src="js/foods.js?v=17"></script>
<script src="js/page-family.js?v=17"></script>
</body>
</html>
